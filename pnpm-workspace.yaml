nodeLinker: hoisted
blockExoticSubdeps: false

allowBuilds:
  '@parcel/watcher': true
  '7zip-bin': true
  electron: true
  electron-winstaller: true
  esbuild: true
  onnxruntime-node: true
  phantomjs-prebuilt: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - 7zip-bin
  - electron
  - electron-winstaller
  - esbuild
  - phantomjs-prebuilt
  - sharp
  - unrs-resolver
minimumReleaseAge: 720
