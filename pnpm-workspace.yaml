nodeLinker: hoisted
blockExoticSubdeps: false
runtimeOnFail: ignore

allowBuilds:
  '@parcel/watcher': true
  '7zip-bin': true
  electron: true
  electron-winstaller: true
  esbuild: true
  onnxruntime-node: true
  phantomjs-prebuilt: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - 7zip-bin
  - electron
  - electron-winstaller
  - esbuild
  - phantomjs-prebuilt
  - sharp
  - unrs-resolver
minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core'
  - '@voidzero-dev/vite-plus-darwin-arm64'
  - '@voidzero-dev/vite-plus-darwin-x64'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu'
  - '@voidzero-dev/vite-plus-linux-arm64-musl'
  - '@voidzero-dev/vite-plus-linux-x64-gnu'
  - '@voidzero-dev/vite-plus-linux-x64-musl'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc'
  - '@voidzero-dev/vite-plus-win32-x64-msvc'
  - vite-plus
  - baseline-browser-mapping
  - electron-to-chromium
  - eslint-plugin-jsdoc
  - ignore
  - minimatch

overrides:
  'form-data@<2.5.6': ^2.5.6
  # PrimeVue 5 起改为付费许可，锁定最后的 MIT 版本
  primevue: 4.5.5
  '@primeuix/themes': 2.0.3
  primeicons: 7.0.0
